name: Daily Scrape Director Proyectos

on:
  schedule:
    - cron: '0 11 * * *'  # 6am Colombia (11am UTC)
  workflow_dispatch:  # Boton manual

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
      
      - name: Run scraper tiempo real
        run: |
          python scraper/main.py
      
      - name: Upload artifacts (Excel + Dashboard)
        uses: actions/upload-artifact@v4
        with:
          name: resultados-diarios
          path: data/
          retention-days: 30
      
      - name: Commit results to repo (opcional)
        run: |
          git config --global user.name "Scraper Bot"
          git config --global user.email "bot@scraper.com"
          git add data/ || true
          git commit -m "Daily scrape $(date)" || true
          git push || true
